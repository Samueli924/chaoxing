; 超星学习通图形化界面 (webgui.py) 配置示例
; 复制本文件为 config_gui.ini 后填入自己的账号密码即可使用。
; config_gui.ini 默认被 .gitignore 忽略，不会上传到 GitHub。

[common]
use_cookies = false
username =
password =
course_list =
speed = 1
jobs = 1
notopen_action = retry
retry_interval = 1.0
chapter_delay_min = 3
chapter_delay_max = 8
api_interval = 1.0
video_log_interval = 3
work_max_retries = 3
add_learning_count = false
target_count = 100

; 题库配置（可选，启用后在图形界面勾选「题库」并填写下方信息）
[tiku]
provider =
submit = false
cover_rate = 0.9
delay = 1.0
tokens =
endpoint =
key =
model =
url =
true_list = 正确,对,√,是
false_list = 错误,错,×,否,不对,不正确

; 通知配置（可选，启用后在图形界面勾选「通知」并填写下方信息）
[notification]
provider = ServerChan
url =
tg_chat_id =
