name: Build GUI Windows executable

on:
  push:
    branches:
      - codex/gui-exe-20261014-a4f2

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pywebview pyinstaller

      - name: Package GUI executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name ChaoxingDesktop
          --add-data "gui_dist;gui_dist"
          --add-data "resource;resource"
          --collect-all webview
          --collect-all pythonnet
          --hidden-import=chardet
          gui_main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ChaoxingDesktop-win64
          path: dist/ChaoxingDesktop.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create gui-v3.1.3-win64-20261014
          dist/ChaoxingDesktop.exe LICENSE
          --repo PaleVerge/chaoxing-gui
          --title "Chaoxing GUI 3.1.3 for Windows x64"
          --notes "GUI executable built with PyInstaller from source commit 03ffdc3daf9089c1f2d5255fa63978842515f57a. Source is available under GPL-3.0."
          --target 03ffdc3daf9089c1f2d5255fa63978842515f57a
          --latest
