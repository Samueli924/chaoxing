<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本机题库 · 超星</title>
<style>body{max-width:960px;margin:32px auto;padding:0 20px;background:#f5f7fa;color:#152333;font:16px system-ui}section{background:white;padding:24px;border-radius:12px;margin:20px 0}input,textarea,select,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%;margin:5px 0 14px}textarea{min-height:100px}button{cursor:pointer;margin:6px}label{display:block}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}p{line-height:1.6}.row{display:flex;gap:8px;align-items:center}#message{white-space:pre-wrap}small{color:#53657a}</style>
<header><a href="/">返回控制台</a><h1>本机题库</h1><p>题目保存在本机数据目录。选择「本机题库」即可离线查询，也可放在 AI 或其他题库之前。</p></header>
<section><label>访问口令（本机未设置时留空）<input id="token" type="password" autocomplete="off"></label><button id="connect">连接 / 刷新</button><p id="message" role="status"></p></section>
<section><h2>添加或更新题目</h2><form id="editor"><label>题目<input id="question" required maxlength="10000"></label><label>题型<select id="type"><option value="0">单选</option><option value="1">多选</option><option value="2">填空</option><option value="3">判断</option><option value="4">简答</option><option value="5">名词解释</option><option value="6">论述</option><option value="7">计算</option></select></label><label>选项（每行一项，保留 A. 等前缀；无选项则留空）<textarea id="options"></textarea></label><label>答案<textarea id="answer" required maxlength="20000"></textarea></label><small>同题目、题型、选项会更新答案。题干请与搜索文本一致，不含题号和末尾分值。多选用 #，填空用 | 分隔。</small><br><button type="submit">保存题目</button></form></section>
<section><h2>导入与导出</h2><p>JSON 数组，每项包含 question、type、options、answer；每批最多 500 条，请求总大小最多 64 KiB。导入前整批校验。</p><label>题目 JSON<textarea id="import" placeholder='[{"question":"示例","type":"0","options":["A. 甲","B. 乙"],"answer":"甲"}]'></textarea></label><button id="import-btn">导入 JSON</button><button id="export-btn">导出当前筛选的全部题目</button></section>
<section><h2>已保存题目</h2><div class="row"><input id="search" placeholder="搜索题干"><button id="search-btn">搜索</button></div><p id="total"></p><table><thead><tr><th>题目</th><th>答案</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><button id="prev">上一页</button><button id="next">下一页</button></section>
<script>
const $=id=>document.getElementById(id);let offset=0,total=0;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Requested-With':'chaoxing-web','X-Token':$('token').value},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.msg||'操作未完成');return d;}
async function guarded(fn){try{await fn();$('message').textContent='操作完成';}catch(e){$('message').textContent=e.message;}}
async function refresh(){const d=await api('/api/bank?q='+encodeURIComponent($('search').value)+'&offset='+offset);total=d.total;$('total').textContent=`共 ${total} 条，当前 ${total ? offset+1 : 0}–${Math.min(offset+d.rows.length,total)}`;$('rows').replaceChildren();for(const row of d.rows){const tr=document.createElement('tr');for(const v of [row.question,row.answer]){const td=document.createElement('td');td.textContent=v;tr.append(td);}const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=()=>{for(const k of ['question','type','answer'])$(k).value=row[k];$('options').value=row.options.join('\n');$('question').focus();};const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{if(confirm('删除这条题目？建议先导出备份。'))guarded(async()=>{await api('/api/bank/delete',{id:row.id});await refresh();});};td.append(edit,del);tr.append(td);$('rows').append(tr);}$('prev').disabled=offset===0;$('next').disabled=offset+d.rows.length>=total;}
$('connect').onclick=()=>guarded(refresh);$('search-btn').onclick=()=>{offset=0;guarded(refresh);};$('prev').onclick=()=>{offset=Math.max(0,offset-100);guarded(refresh);};$('next').onclick=()=>{offset+=100;guarded(refresh);};
$('editor').onsubmit=e=>{e.preventDefault();guarded(async()=>{await api('/api/bank/import',{rows:[{question:$('question').value,type:$('type').value,options:$('options').value.split('\n').filter(x=>x.trim()),answer:$('answer').value}]});await refresh();});};
$('import-btn').onclick=()=>guarded(async()=>{await api('/api/bank/import',{rows:JSON.parse($('import').value)});await refresh();});
$('export-btn').onclick=()=>guarded(async()=>{const rows=[];let start=0;while(true){const d=await api('/api/bank?q='+encodeURIComponent($('search').value)+'&offset='+start);rows.push(...d.rows);start+=d.rows.length;if(start>=d.total||!d.rows.length)break;}const url=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='question-bank.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
guarded(refresh);
</script></html>
