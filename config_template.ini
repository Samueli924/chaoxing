; ============================================================
;  超星学习通助手 配置文件
;  用法：把本文件复制为 config.ini，填好手机号和密码即可。
;       运行： python main.py -c config.ini
;  说明：所有配置项都有默认值，通常只需要填手机号和密码；
;       其余项保留默认即可，需要时再取消对应行的注释修改。
; ============================================================

[common]
; —— 只需要填这两项 ——
username = 手机号
password = 密码

; 要学习的课程ID（留空则运行时再选择；多个用英文逗号分隔）
; course_list =

; —— 以下均为可选，保持默认即可 ——
; 视频播放倍速（1~2，默认1）
; speed = 1
; 同时进行的章节数（默认4）
; jobs = 4
; 遇到未开放章节的处理：retry-稍后重试(默认) / ask-询问 / continue-跳过
; notopen_action = retry
; 完成任务点后是否增加章节学习次数（默认false）
; add_learning_count = false
; 章节学习次数目标（默认100）
; target_count = 100
; 章节检测答错后最多重做几次（默认3）
; work_max_retries = 3


; ============================================================
;  题库（用于章节检测/作业自动答题）。不需要答题可整段删除或不填 provider。
;  provider 可选：TikuGo(免费,无需配置) / TikuYanxi / TikuLike / AI / SiliconFlow / TikuAdapter / TikuManual
;  多个题库按顺序回退，例如：provider = TikuGo,TikuYanxi
; ============================================================
[tiku]
provider = TikuGo

; 答完题是否自动提交：true-提交(正确率不保证) / false-只保存不提交(默认，稍后可自行到学习通检查)
submit = false
; 最低题库覆盖率，达到才提交（默认0.9）
; cover_rate = 0.9
; 每道题之间的查询间隔秒数（默认1）
; delay = 1

; —— 言溪题库 / LIKE知识库：填 Token（多个用英文逗号分隔）——
; tokens =

; —— AI 大模型（任意兼容 OpenAI 接口的服务）——
; endpoint = https://api.deepseek.com/v1
; key =
; model = deepseek-chat
; min_interval_seconds = 3
; http_proxy =
; check_llm_connection = true

; —— 硅基流动 ——
; siliconflow_key =
; siliconflow_model = deepseek-ai/DeepSeek-V3

; —— TikuAdapter（自建题库）——
; url =

; —— GO题（可选，填 Token 可解除限流）——
; go_authorization =

; —— 手动输入模式 ——
; manual_mode_default = batch
; manual_mode_separator = ;

; 判断题的正确/错误说法（一般无需修改）
; true_list = 正确,对,√,是
; false_list = 错误,错,×,否,不对,不正确


; ============================================================
;  结束后推送通知（可选）。不需要可整段删除。
;  provider 可选：ServerChan / Qmsg / Bark / Telegram
; ============================================================
[notification]
; provider = ServerChan
; url =
; Telegram 额外需要：
; tg_chat_id =
