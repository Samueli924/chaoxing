[common]
; 使用cookie登录，填写true则忽略账号密码，直接从cookies.txt读取cookie登录
use_cookies=false

; 手机号账号(必填)
username = xxx

; 登录密码(必填)
password = xxx

; 要学习的课程ID列表, 逗号隔开(选填，不需要则留空)
course_list = xxx,xxx,xxx

; 视频播放倍速(默认1，最大2)
speed = 1

; 同时进行的章节数量
jobs = 2

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action = retry

; 任务失败/未开启章节的重试等待时间, 单位秒(默认1.0)
retry_interval = 1.0

; 是否允许章节检测答错后自动重做(默认false)
; 注意: 仅允许作答一次的课程若开启重做, 重做轮将无法获取题目导致章节处理失败
work_redo_enabled = false
; 章节检测答错后的最大重做次数(默认3)
; 开启后, 提交章节检测会自动检查得分: 若有答错的题目, 会将错误反馈给AI并重新作答提交, 直到全部正确或达到最大重做次数
work_max_retries = 3
; 是否在刷完课程任务点后增加章节学习次数
add_learning_count = false

; 章节学习次数的目标总次数（所有章节轮询访问，每访问一次计1次）
target_count = 100

; 是否刷「章节（目录）」
; 章节和「任务中心 -> 教学任务」是两套互相独立的学习入口，记录不互通：
; 只刷任务中心时把这项设为 false；命令行可用 --no-chapters 临时关掉，--chapters 强制打开。
; 注意：chapter_study 和 task_center 不能同时为 false，否则没有可刷的内容。
chapter_study = true

; 是否刷「任务中心 -> 教学任务」
; 新版泛雅课程首页可以把学习内容发布成"教学任务"，它和"章节"是两套互相独立的学习入口：
; 任务点按分组顺序解锁，完成上一组才能学下一组。
; 目前已接入 视频 / 文档 / AI实践；章节同步、作业、思考题、主题讨论仍按真实平台证据逐项适配。
; 命令行可用 --no-task-center 临时关掉，--task-center 强制打开。
task_center = true

; 只刷讨论（任务里的主题讨论），其它类型本次跳过；向导里选第 4 项时会自动打开
only_discussion = false

; 讨论怎么刷：task = 任务里的主题讨论（自动，按课程要求的顺序）；
; board = 讨论区（自己挑帖子回复，逐条给草稿、确认后发送）
discussion_mode = task

; 任务中心涉及作业、讨论、AI实践的最终提交模式：
; auto（默认）= 作答完成后自动提交，适合挂后台刷课；
; confirm = 每次提交前显示内容并询问（需要人工盯着时才用）。
task_center_submit_mode = auto

; AI实践的最低目标分数与单次运行最多重答轮数
ai_practice_min_score = 85
ai_practice_max_rounds = 5

; 每门课最多刷几个任务点(章节)，0 = 全部刷完
; 例如填 3，就是每门课只刷前 3 个还没完成的章节
max_points_per_course = 0

; 每门课最多刷几个教学任务（任务中心 -> 教学任务），0 = 全部推进
; 例如填 3，就是每门课只推进前 3 个还没完成的教学任务
; 也支持按课程指定：2151141:3,189191:0
max_tasks_per_course = 0

; 视频是否一个一个按顺序刷（串行）
; false(默认) = 按上面 jobs 的数量并发，速度快
; true         = 同一时间只播一个视频；如果遇到"刷完了又变回没刷/进度被回退"，
;                改成 true 可以明显降低被平台判异常的概率（代价是慢一些）
serial_video = false

[tiku]
; 可选项 :
; 1. TikuYanxi(言溪题库 https://tk.enncy.cn/)
; 2. TikuLike(LIKE知识库 https://www.datam.site/)
; 3. TikuAdapter(开源项目 https://github.com/DokiDoki1103/tikuAdapter)
; 4. AI(需自行寻找兼容openai格式的API Endpoint和Key)
; 5. SiliconFlow(硅基流动AI：https://siliconflow.cn/)
; 6. TikuGo(GO题/网课小工具题库 https://q.icodef.com/)
; 7. TikuManual(手动输入模式，命令行输入)
; 支持配置多个题库回退，按顺序依次查询，示例：provider=TikuGo,TikuYanxi,TikuLike
provider=TikuYanxi

; 是否启用大模型连接检查，填写 true 表示在启动时检查大模型连接是否可用，false 表示不检查
; 仅在使用 AI 或 SiliconFlow 题库时生效，会消耗少量token
check_llm_connection=true

; 是否提交答题，填写false表示答完题后不提交而是保存搜到的题目，随后你可以自行前往学习通修改或提交
; 填写true表示达到最低题库覆盖率提交，没达到只保存搜到的题目，进入下一章节，不保证正确率！不正确的填写会被视为false
; 题库覆盖率-搜到的题目占总题目的比例
; 对于那些需要解锁的章节，你必须要提交章节检测才能继续下一章节的学习，自行决定是否开启
; 选择提交答题但题库覆盖率不达标时，若是需要解锁的章节，保存后会回滚重新答题且忽略搜到率提交
submit=false

; 最低题库覆盖率
cover_rate=0.9

; 搜索多个题目时间隔的时间，单位秒
delay=1.0

; 用于言溪题库的TOKEN，同样使用英文逗号隔开多个，会按顺序去使用
; 或用于LIKE知识库的TOKEN，在使用LIKE知识库时会随机调用token进行查询。
tokens=

; 下面是用于LIKE知识库模型的专属配置，其他题库无需关注下列选项
; likeapi_search=true表示启用模型的联网搜索功能，false则不启用联网搜索
; likeapi_vision=true表示启用模型的视觉能力，false则不启用视觉能力（可以识别图片中的内容并进行答题，支持超星url格式的文本图片题）
; likeapi_model=glm-4.5-air表示使用glm-4.5-air模型，其他模型请自行查询
; likeapi_retry=true表示启用自动重试功能，false则关闭该功能
; likeapi_retry_times设置最大重试次数
; 模型支持列表：https://www.datam.site/dashboard/pricing
likeapi_search=false
likeapi_vision=true
likeapi_model=glm-4.5-air
likeapi_retry=true
likeapi_retry_times=3
; 用于TikuAdapter题库的url
url=

; 用于GO题（网课小工具题库）的配置
; go_authorization 为公众号"一之哥哥"中申请到的解除限流的Token（可选）
; go_min_interval 设置请求GO题库的最小时间间隔，单位秒，默认为1.0秒
; go_retry_times 设置请求GO题库的重试次数，默认为3次
; go_retry_backoff 设置请求GO题库的重试指数退避基数，默认为1.2倍
go_authorization=
go_min_interval=1.0
go_retry_times=3
go_retry_backoff=1.2

; 用于AI大模型答题的API Endpoint和Key
; 请注意API Endpoint可能需要带上/v1路径，例如: https://example.com/v1
; min_interval_seconds 为 API 请求的最小间隔时间，单位秒, 0表示不限制
endpoint=
key=
model=
; 请求间隔时间
min_interval_seconds=3

; 大模型 thinking（推理）策略：auto（默认）= 让模型自己决定。
; DeepSeek V4.1 flash 默认带推理，正确率明显更高；老版本模型出现"正文为空"时会自动降级重试。
; on = 强制开启推理，off = 强制关闭（更快但更容易答错）。
thinking=auto

; 客观题（单选/多选）采样投票次数：同一题问 N 次取多数答案，降低偶发看错选项。
; 1 = 关闭投票（最快）；3 = 推荐；最多 5。
objective_votes=3
; 可选配置请求大模型时使用的代理，填写示例：http://examples.com
http_proxy=

;硅基流动AI专属配置，以siliconflow开头的
;硅基流动获取token的地址https://cloud.siliconflow.cn/account/ak
siliconflow_key = 
;可选模型deepseek-ai/DeepSeek-R1;deepseek-ai/DeepSeek-V3等，这里查看https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
siliconflow_model = deepseek-ai/DeepSeek-R1
; 可选自定义端点
siliconflow_endpoint = https://api.siliconflow.cn/v1/chat/completions
; 请求间隔时间
; min_interval_seconds = 3 请将硅基流动请求间隔时间填入第52行，不要去掉此行注释，否则会重复导致报错（临时解决）

; 手动模式配置
; manual_mode_default: batch-一次性输入所有(默认), single-一题一输入
manual_mode_default=batch
; manual_mode_separator: 批量输入时的答案分割符，默认为分号“;”
; 可选值：分号 ;、逗号 ,、空格 space、换行 \n
manual_mode_separator=;

; 用于判断判断题对应的选项，不要留有空格，不要留有引号，逗号为英文逗号
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确
[notification]
provider=ServerChan
; 可选项 :
; 1. ServerChan(Server酱 多平台推送 https://sct.ftqq.com/)
; 2. Qmsg(Qmsg酱 qq推送 https://qmsg.zendee.cn/)
; 3. Bark(Bark ios推送 https://bark.day.app/)
; 4. Telegram(Telegram Bot推送 https://api.telegram.org/  可以使用第三方中转API)
; 外部通知服务的提供方
url=
; Server酱,Qmsg酱或Bark的url,以下为例子，需要自己将key填入*号位置
; https://sctapi.ftqq.com/****************.send Server酱
; https://qmsg.zendee.cn/send/**************** Qmsg酱
; https://api.day.app/**************/ Bark的高级用法请自行查阅app与其文档的说明（高级用法不一定能行，没测试过）
; https://api.telegram.org/bot**********:***********************/sendMessage Telegram(具体用法请查阅Telegram官方API文档)
; Telegram推送时使用的chat_id
tg_chat_id=XXXXXX
