[project]
name = "chaoxing"
version = "4.0.0"
description = "超星学习通/超星尔雅/泛雅超星 自动完成任务点，支持命令行与网页控制台"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
# 验证码自动识别（可选，依赖较大：onnxruntime / opencv / numpy）
ocr = ["ddddocr>=1.5.6"]

[project.scripts]
chaoxing = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["api"]

[tool.setuptools.package-data]
api = []

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
